
networks:
  ariadne-network:
    driver: bridge

services:
  ariadne-engine:
    image: ariadneindustries/ariadne-engine:0.3.0-on-prem
    restart: unless-stopped
    ports:
      - "44444:44444"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
      - apparmor=unconfined # Required for bubblewrap to create user namespaces inside the container. On the Docker host, configure AppArmor as documented in the README.
      - seccomp=unconfined  # Required for bubblewrap to function properly within the container. Without this, seccomp may block bwrap system calls.
    privileged: true        # Required for bubblewrap user namespace creation inside Docker. ⚠️ This reduces container isolation against the host kernel. Bubblewrap still provides process and path isolation inside the container via configured read-only and read-write roots.
    volumes:
      # --- Bind Mounts (Long-form syntax) ---
      # We use the long-form volume syntax with `create_host_path: false` to ensure that 
      # all mounted directories and files already exist on the host before Docker creates them.
      # This is strongly recommended because Docker automatically creates missing bind-mount 
     # directories as `root:root` when using the short-form syntax (e.g., `./databases:/container/path`).
      # Auto-created directories owned by root cause permission conflicts when the container user 
     # (default UID 1000 via ariadne image) tries to write into them. With long-form and 
      # `create_host_path: false`, Docker refuses to start until you create the paths yourself, 
      # ensuring your host user owns them from the start.

      # Required. Persistent engine and database state lives here.
      - type: bind
        source: ./databases
        target: /app/aaa-bundle/databases
        bind:
          create_host_path: false

      # Required. Must already contain the needed Docling models and tokenizer files.
      - type: bind
        source: ./models/docling
        target: /app/aaa-bundle/models/docling
        read_only: true
        bind:
          create_host_path: false

      # Recommended. Faster Whisper stores or reuses model files here.
      - type: bind
        source: ./models/faster-whisper
        target: /app/aaa-bundle/models/faster-whisper
        bind:
          create_host_path: false

      # Optional. Mount only if you use custom flow scripts.
      - type: bind
        source: ./flow-scripts
        target: /app/aaa-bundle/flow-scripts
        read_only: true
        bind:
          create_host_path: false

      # Optional. Mount only if you use custom local skills.
      - type: bind
        source: ./skills
        target: /app/aaa-bundle/skills
        read_only: true
        bind:
          create_host_path: false

      # Optional. If you keep this mount, create at least an empty file on the host first.
      - type: bind
        source: ./mcp_servers.json
        target: /app/aaa-bundle/mcp_servers.json
        read_only: true
        bind:
          create_host_path: false

      # Required for exclusive local model routing.
      - type: bind
        source: ./model_config.json
        target: /app/aaa-bundle/model_config.json
        read_only: true
        bind:
          create_host_path: false

      # Optional. Remove this mount if you do not use local automation policy.
      - type: bind
        source: ./local_automation_policy.json
        target: /app/aaa-bundle/config/local_automation_policy.json
        read_only: true
        bind:
          create_host_path: false

      # Optional. Remove this mount if you do not use dreaming runtime config.
      - type: bind
        source: ./dreaming_runtime_config.json
        target: /app/aaa-bundle/dreaming_runtime_config.json
        read_only: true
        bind:
          create_host_path: false
    environment:
      # Optional. Defaults to 1000:1000. Set both in a local .env file if the host user
      # uses different IDs and bind-mounted files should belong to that host user.
      - HOST_UID=${HOST_UID:-1000}
      - HOST_GID=${HOST_GID:-1000}
      # Optional. Defaults to 0002 in the image entrypoint.
      - UMASK=0002
      - AAA_IDP_HOST=http://host.docker.internal:8000 # Defaults to "https://idp.ariadneanyverse.de" **but ignored if AAA_IDENTITY_SOURCE=integrated-idp**
      - AAA_EMBEDDINGS_BASE_URL=http://llama-cpp-embedding-server:44441/v1 # Required for embeddings functionality. **Error if not set.**
      - AAA_IS_PRIVACY_LEVEL_EXCLUSIVE_ENABLED=true # Defaults to true. Enables Exclusive LLMs based on model_config.json (default for local-only configurations).
      - AAA_IS_PRIVACY_LEVEL_PREMIUM_ENABLED=false # Defaults to true. When enabled, use Premium-level privacy LLMs provided by Ariadne Industries.
      - AAA_IS_PRIVACY_LEVEL_STANDARD_ENABLED=false # Defaults to true. When enabled, use Standard-level privacy LLMs provided by Ariadne Industries.
      - AAA_FASTER_WHISPER_MODEL=small # default is large-v3-turbo. Small is good for most cases and fast on cpu
      - AAA_FASTER_WHISPER_DEVICE=cpu # Defaults to cpu. Set to cuda to run faster-whisper on a GPU.
      - AAA_FALKORDB_HOST=falkordb # Used only when AAA_GRAPHITI_BACKEND=falkordb. Must match the FalkorDB service name or external host.
      - AAA_FALKORDB_PORT=6379 # Used only when AAA_GRAPHITI_BACKEND=falkordb.
      - AAA_FALKORDB_PASSWORD=${AAA_FALKORDB_PASSWORD:-default} # Used only when AAA_GRAPHITI_BACKEND=falkordb.
      - AAA_GRAPHITI_BACKEND=falkordb # Set to `kuzu` to use embedded per-user Graphiti databases in ./databases/<identity_key>/graphiti.kuzu instead of FalkorDB.
      - AAA_DREAMING_RUNTIME_STARTUP_DELAY_SECONDS=120 # Example env fallback if no dreaming_runtime_config.json is mounted.
      - AAA_DREAMING_RUNTIME_INTERVAL_SECONDS=600 # Example env fallback if no dreaming_runtime_config.json is mounted.
      - AAA_DREAMING_RUN_COOLDOWN_SECONDS=500 # Example env fallback if no dreaming_runtime_config.json is mounted.
      - AAA_CLOUD_LLM_ENDPOINT=${AAA_CLOUD_LLM_ENDPOINT:-https://aaa.ariadneanyverse.de/v1} # Optional override for Premium/Standard routing.
      - AAA_OPENAI_API_KEY=${AAA_OPENAI_API_KEY:-} # Optional. Used only by custom model_config.json entries with provider=openai and api_key_env_var=AAA_OPENAI_API_KEY.
      - AAA_MISTRAL_PLATFORM_API_KEY=${AAA_MISTRAL_PLATFORM_API_KEY:-} # Optional. Used by the built-in Premium Mistral models and by custom model_config.json entries with provider=mistral-ai.
      - AAA_FIREWORKS_API_KEY=${AAA_FIREWORKS_API_KEY:-} # Optional. Used only by custom model_config.json entries with provider=fireworks-ai and api_key_env_var=AAA_FIREWORKS_API_KEY.
      # - AAA_LOCAL_AAA_PORT=44444 # defaults to 44444
      - AAA_IDENTITY_SOURCE=integrated-idp # default is ariadne-anyverse, for local setup it should be integrated-idp.
      - AAA_WORKER_PROCESSES=2 # Overrides default of 4 workers. Each worker uses around **4GB of RAM**.
    
    networks:
      - ariadne-network

  ariadne-webapp:
    image: ariadneindustries/ariadne-webapp:0.3.0-web-bff
    restart: unless-stopped
    ports:
      - "43380:80"
      - "44380:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - AAA_ENDPOINT_URL=http://host.docker.internal:44444/endpoint # can be set to the Ariadne Engine container, server ip address, or host. An Ariadne Engine must run there.
      - IDP_BASE_URL=http://host.docker.internal:44444/integrated_idp # should be the Identity Provider used by the Ariadne Engine instance. Can be the integrated idp of the Ariadne Engine if enabled
    networks:
      - ariadne-network

  llama-cpp-embedding-server:
    image: ghcr.io/ggml-org/llama.cpp:server
    restart: unless-stopped
    volumes:
      - type: bind
        source: ./models/others/bge-m3-q4_k_m.gguf
        target: /models/bge-m3-q4_k_m.gguf
        read_only: true
        bind:
          create_host_path: false
    # Custom-Startbefehl (Passe den Modellpfad/Parameter an)
    ports:
      - "44441:44441"
    command: >
      -m /models/bge-m3-q4_k_m.gguf
      --embeddings
      --host 0.0.0.0
      --port 44441
      --parallel 2
      --batch-size 4096
      --ubatch-size 4096
      -c 8192
    networks:
      - ariadne-network

  falkordb: # Needed only when AAA_GRAPHITI_BACKEND=falkordb. Can be removed when using AAA_GRAPHITI_BACKEND=kuzu.
    image: falkordb/falkordb:latest
    restart: unless-stopped
    ports:
      - "${AAA_FALKORDB_PORT:-44400}:6379"
      - "3000:3000" # optional Web UI
    environment:
      # Redis-Args (Persistenz + Sicherheit + Sichtbarkeit)
      REDIS_ARGS: "--protected-mode yes --bind 0.0.0.0 --requirepass ${AAA_FALKORDB_PASSWORD:-default} --appendonly yes --appendfsync everysec --aof-use-rdb-preamble yes --save 3600 1 --save 300 100 --save 60 10000 --dbfilename dump.rdb"
      # FalkorDB-Args (z.B. Threads)
      FALKORDB_ARGS: "THREAD_COUNT 4"
    volumes:
      - type: bind
        source: ./databases/falkordb
        target: /var/lib/falkordb/data
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${AAA_FALKORDB_PASSWORD:-default} PING | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
    stop_grace_period: 20s
    networks:
      - ariadne-network
